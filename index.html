<style>
  body{font-family:'Sora',system-ui,sans-serif}
  .state{fill:#334155;stroke:#94a3b8;stroke-width:.7;vector-effect:non-scaling-stroke;stroke-linejoin:round;transition:fill .15s}
  .state:hover{fill:#3f4f66}
  .dot{fill:#fff;stroke:#0f172a;stroke-width:1.5;cursor:pointer;transform-box:fill-box;transform-origin:center;
       transition:transform .15s,fill .15s;filter:drop-shadow(0 1px 2px rgba(0,0,0,.6))}
  .dot:hover,.dot:focus-visible{transform:scale(1.5);fill:#7dd3fc;outline:none}
  .locked .dot{cursor:default}
  .locked .dot:hover{transform:none;fill:#fff}
  .dot.ok{fill:#22c55e!important;transform:scale(1.6)}
  .dot.bad{fill:#ef4444!important;transform:scale(1.6)}
  .dot.reveal{fill:#22c55e!important;transform:scale(1.7);animation:pulse .5s ease 3}
  .ans-label{fill:#fff;font-weight:700;paint-order:stroke;stroke:#14532d;stroke-width:3px;stroke-linejoin:round;text-anchor:middle;pointer-events:none}
  @keyframes pulse{50%{fill:#86efac;transform:scale(2.2)}}
  .glass{background:linear-gradient(135deg,rgba(255,255,255,.16),rgba(255,255,255,.04));
    box-shadow:inset 0 1px 0 rgba(255,255,255,.35),inset 0 -1px 0 rgba(255,255,255,.05),0 25px 50px -12px rgba(0,0,0,.6)}
  @media (prefers-reduced-motion:reduce){.dot.reveal{animation:none}}

<body class="bg-slate-900 text-slate-100 min-h-screen overflow-x-hidden">

<!-- ambient colour blobs so the glass has something to refract -->
<div class="fixed inset-0 -z-0 pointer-events-none">
  <div class="absolute -top-32 -left-24 w-[28rem] h-[28rem] rounded-full bg-indigo-600/30 blur-3xl"></div>
  <div class="absolute bottom-0 right-0 w-[30rem] h-[30rem] rounded-full bg-teal-500/20 blur-3xl"></div>
</div>

<main class="relative z-10 min-h-screen flex flex-col lg:block">
  <!-- Question panel -->
  <section class="glass backdrop-blur-xl border border-white/20 rounded-3xl p-5 m-3 lg:absolute lg:top-6 lg:left-6 lg:w-96 lg:m-0 z-20">
    <div class="flex items-center justify-between gap-3 mb-4">
      <select id="chapterSelect" aria-label="Chapter"
        class="bg-slate-900/50 border border-white/20 rounded-xl px-3 py-2 text-sm min-w-0 flex-1 focus:outline-none focus:ring-2 focus:ring-sky-400"></select>
      <div class="text-right shrink-0">
        <div id="score" class="text-2xl font-bold leading-none">0/0</div>
        <div class="text-xs text-slate-400 mt-1">correct</div>
      </div>
    </div>
    <div class="h-1.5 rounded-full bg-white/10 overflow-hidden mb-4">
      <div id="bar" class="h-full bg-sky-400 transition-all duration-500" style="width:0"></div>
    </div>
    <p id="progress" class="text-sm text-slate-400 mb-1"></p>
    <h1 id="question" class="text-lg font-semibold leading-snug min-h-[4.5rem]"></h1>
    <p id="feedback" class="text-sm mt-2 min-h-[2.75rem]" aria-live="polite"></p>
  </section>

  <!-- Map -->
  <section class="relative flex-1 flex items-center justify-center p-2 lg:min-h-screen lg:pl-[26rem]">
    <svg id="map" viewBox="0 0 612 696" class="w-full max-h-[85vh] lg:max-h-screen drop-shadow-2xl" role="img" aria-label="Map"></svg>
    <div class="absolute bottom-4 right-4 flex flex-col gap-2 z-10">
      <button id="zin" aria-label="Zoom in" class="glass backdrop-blur-xl border border-white/25 w-10 h-10 rounded-xl text-xl hover:bg-white/20 focus:outline-none focus:ring-2 focus:ring-sky-400">+</button>
      <button id="zout" aria-label="Zoom out" class="glass backdrop-blur-xl border border-white/25 w-10 h-10 rounded-xl text-xl hover:bg-white/20 focus:outline-none focus:ring-2 focus:ring-sky-400">&minus;</button>
      <button id="zreset" aria-label="Reset view" class="glass backdrop-blur-xl border border-white/25 w-10 h-10 rounded-xl text-sm hover:bg-white/20 focus:outline-none focus:ring-2 focus:ring-sky-400">&#8634;</button>
    </div>
  </section>
</main>

<!-- Hover tooltip for dots -->
<div id="tip" class="hidden fixed z-40 pointer-events-none -translate-x-1/2 -translate-y-full px-3 py-1.5 rounded-xl text-sm font-semibold backdrop-blur-md border border-white/25 bg-slate-900/70 shadow-xl whitespace-nowrap"></div>

<!-- Completion modal -->
<div id="modal" class="hidden fixed inset-0 z-30 items-center justify-center bg-slate-950/50 backdrop-blur-sm p-4">
  <div class="glass backdrop-blur-2xl border border-white/25 rounded-3xl p-8 max-w-sm w-full text-center">
    <h2 class="text-2xl font-bold mb-2">Quiz complete</h2>
    <p id="finalScore" class="text-5xl font-bold my-4"></p>
    <p id="finalMsg" class="text-slate-300 mb-6"></p>
    <button id="restart" class="w-full py-3 rounded-2xl bg-white/15 hover:bg-white/25 border border-white/30 font-semibold focus:outline-none focus:ring-2 focus:ring-sky-400 transition">Restart quiz</button>
  </div>
</div>

const $ = id => document.getElementById(id);

// Mercator projection fitted to the map's bounds -> SVG coordinates
function project(m, lat, lon){
  const [W, H] = m.viewBox.split(" ").slice(2).map(Number), b = m.bounds;
  const mer = p => Math.log(Math.tan(Math.PI/4 + p*Math.PI/360));
  return [ (lon - b.lon0) / (b.lon1 - b.lon0) * W,
           (mer(b.lat1) - mer(lat)) / (mer(b.lat1) - mer(b.lat0)) * H ];
}

let view, base, baseR = 5.5, dragged = false;

  svg.querySelectorAll(".dot").forEach(c => c.setAttribute("r", (baseR / Math.sqrt(z)).toFixed(2)));

}
function placeLabel(t, z){
  const fs = baseR * 2.6 / Math.sqrt(z), r = baseR / Math.sqrt(z);

}
function revealAnswer(id){
  const dot = $("dot-" + id), svg = $("map"), cx = +dot.getAttribute("cx"), cy = +dot.getAttribute("cy");

}
function zoomAt(f, cx, cy){
  const w = Math.min(base.w, Math.max(base.w / 14, view.w / f)), k = w / view.w;
  view = { w, h: view.h * k, x: cx - (cx - view.x) * k, y: cy - (cy - view.y) * k };
  clampView(); applyView();
}
function clampView(){
  view.x = Math.min(Math.max(view.x, base.x), base.x + base.w - view.w);
  view.y = Math.min(Math.max(view.y, base.y), base.y + base.h - view.h);
}
function svgPoint(e){
  const svg = $("map"), p = svg.createSVGPoint(); p.x = e.clientX; p.y = e.clientY;
  return p.matrixTransform(svg.getScreenCTM().inverse());
}
function setupView(m){
  const [x, y, w, h] = m.viewBox.split(" ").map(Number);
  base = { x, y, w, h }; view = { ...base }; baseR = m.dotR || 5.5;
}
(function initZoom(){
  const svg = $("map");
  svg.addEventListener("wheel", e => { e.preventDefault(); const p = svgPoint(e); zoomAt(e.deltaY < 0 ? 1.25 : 0.8, p.x, p.y); }, { passive: false });
  svg.addEventListener("pointerdown", e => {
    if (!base || view.w >= base.w - 0.01) return;
    const sx = e.clientX, sy = e.clientY, v0 = { ...view }, scale = svg.getScreenCTM().a; dragged = false;
    const move = ev => {
      const dx = ev.clientX - sx, dy = ev.clientY - sy;
      if (!dragged && Math.hypot(dx, dy) < 5) return;
      dragged = true; view.x = v0.x - dx / scale; view.y = v0.y - dy / scale; clampView(); applyView();
      $("tip").classList.add("hidden");
    };
    const up = () => { window.removeEventListener("pointermove", move); window.removeEventListener("pointerup", up); setTimeout(() => dragged = false, 0); };
    window.addEventListener("pointermove", move); window.addEventListener("pointerup", up);
  });
  const mid = () => ({ x: view.x + view.w / 2, y: view.y + view.h / 2 });
  $("zin").addEventListener("click", () => { const c = mid(); zoomAt(1.6, c.x, c.y); });
  $("zout").addEventListener("click", () => { const c = mid(); zoomAt(1 / 1.6, c.x, c.y); });
  $("zreset").addEventListener("click", () => { view = { ...base }; applyView(); });
})();

function renderMap(chap){
  const m = MAPS[chap.mapType], svg = $("map");
  if (renderedMap !== chap.mapType){
    svg.innerHTML = ""; svg.setAttribute("aria-label", m.label);
    m.regions.forEach(([id, name, d]) => {
      const p = document.createElementNS(NS, "path");
      p.setAttribute("class", "state"); p.setAttribute("d", d);
      const t = document.createElementNS(NS, "title"); t.textContent = name; p.appendChild(t);
      svg.appendChild(p);
    });
    renderedMap = chap.mapType;
  }
  setupView(m);
  svg.querySelectorAll(".dot").forEach(n => n.remove());
  LOCNAME = {};
  chap.locations.forEach(loc => {
    LOCNAME[loc.id] = loc.name;
    const [x, y] = project(m, loc.lat, loc.lon);
    const c = document.createElementNS(NS, "circle");
    c.setAttribute("class", "dot"); c.setAttribute("id", "dot-" + loc.id);
    c.setAttribute("cx", x.toFixed(1)); c.setAttribute("cy", y.toFixed(1));
    c.setAttribute("tabindex", "0"); c.setAttribute("role", "button"); c.setAttribute("aria-label", loc.name);
    const showTip = () => { const r = c.getBoundingClientRect(), t = $("tip");
      t.textContent = loc.name; t.style.left = (r.left + r.width/2) + "px"; t.style.top = (r.top - 6) + "px"; t.classList.remove("hidden"); };
    const hideTip = () => $("tip").classList.add("hidden");
    c.addEventListener("mouseenter", showTip); c.addEventListener("mouseleave", hideTip);
    c.addEventListener("focus", showTip); c.addEventListener("blur", hideTip);
    c.addEventListener("click", () => { if (!dragged) answer(loc.id); });
    c.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); answer(loc.id); } });
    svg.appendChild(c);
  });
  applyView();
}

function shuffle(a){ a = [...a]; for (let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }

function startChapter(key){
  chapter = QUIZ_DATA[key];
  renderMap(chapter);
  queue = shuffle(chapter.questions); idx = 0; score = 0; locked = false;
  $("modal").classList.add("hidden"); $("modal").classList.remove("flex");
  showQuestion();
}

function showQuestion(){
  document.querySelectorAll(".dot").forEach(s => s.classList.remove("ok","bad","reveal"));
  document.querySelectorAll(".ans-label").forEach(n => n.remove());
  $("map").classList.remove("locked"); locked = false;
  $("question").textContent = queue[idx].questionText;
  $("feedback").className = "text-sm mt-2 min-h-[2.75rem] text-slate-400";
  $("feedback").textContent = "Select the correct dot on the map.";
  updateHUD();
}

function updateHUD(){
  $("score").textContent = `${score}/${queue.length}`;
  $("progress").textContent = `Question ${Math.min(idx+1, queue.length)} of ${queue.length}`;
  $("bar").style.width = `${(idx / queue.length) * 100}%`;
}

function answer(id){
  if (locked) return;
  locked = true; $("map").classList.add("locked");
  const q = queue[idx], correct = id === q.correctTargetId, fb = $("feedback");
  if (correct){
    score++; $("dot-" + id).classList.add("ok");
    fb.className = "text-sm mt-2 min-h-[2.75rem] text-green-400"; fb.textContent = `Correct — ${LOCNAME[id]}.`;
  } else {
    $("dot-" + id).classList.add("bad"); revealAnswer(q.correctTargetId);
    fb.className = "text-sm mt-2 min-h-[2.75rem] text-red-400"; fb.innerHTML = `Wrong — you chose ${LOCNAME[id]}.<br><span class="font-semibold text-green-400">Correct answer: ${LOCNAME[q.correctTargetId]}</span>`;
  }
  idx++; updateHUD();
  setTimeout(() => idx >= queue.length ? finish() : showQuestion(), correct ? 1500 : 2800);
}

function finish(){
  $("finalScore").textContent = `${score}/${queue.length}`;
  const pct = score / queue.length;
  $("finalMsg").textContent = pct === 1 ? "Perfect run." : pct >= .7 ? "Strong result. A few more to lock in." : "Keep practising — every round sticks a little more.";
  $("modal").classList.remove("hidden"); $("modal").classList.add("flex");
}

// Chapter dropdown: only chapters whose map is registered
const sel = $("chapterSelect");
Object.entries(QUIZ_DATA).filter(([,c]) => MAPS[c.mapType]).forEach(([k,c]) => sel.add(new Option(`${c.title} · ${c.mapType === 'world' ? 'World' : 'India'} map`, k)));
sel.addEventListener("change", () => startChapter(sel.value));
$("restart").addEventListener("click", () => startChapter(sel.value));
startChapter(sel.value);
</script>
